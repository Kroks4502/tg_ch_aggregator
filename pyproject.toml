[project]
name = "tg-ch-aggregator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "peewee==3.18.2",
    "aiogram>=3.13,<4",
    "APScheduler==3.11.0",
    "async-lru==2.0.5",
    "psycopg2-binary==2.9.10",
    "yoyo-migrations==9.0.0",
    "gevent==25.5.1",
    "telethon>=1.36,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pre-commit>=4.2.0",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-mock==3.14.1",
    "aiogram==3.21.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "env",
    "tests",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T20",  # flake8-print (T201=print, T203=pprint)
    "RET",  # flake8-return
]
ignore = [
    "E203",  # whitespace before ':' (black-compatible)
    "E712",  # comparison to True/False (peewee query idiom)
]

[tool.ruff.format]
# defaults совпадают с black
